[workspace]
resolver = "2"
members = [
    "crates/egov-client",
    "crates/law-normalizer",
    "crates/law-diff",
    "crates/kanpo-client",
    "crates/kanpo-parser",
    "crates/kanpo-parser-wasm",
    "crates/kanpo-lm",
    "crates/kanpo-pdf",
    "crates/kanpo-linker",
    "crates/search-index",
    "crates/lawpub-cli",
    "crates/kokkai-client",
    "crates/linking",
    "crates/pubcomment-client",
    "crates/procurement-client",
    "crates/reiki-client",
    "crates/shingikai-client",
    "crates/estat-client",
    "crates/gian-client",
    "crates/hanrei-client",
    "crates/tsutatsu-client",
    "crates/shitsumon-client",
    "crates/guidance-client",
    "crates/jlt-client",
    "crates/treaty-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.22"
walkdir = "2"
hex = "0.4"
aho-corasick = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"

# 官報 PDF は AES-256（R6）で暗号化されていて、鍵の導出に AES と SHA-2 を数十回まわす。
# 暗号の crate は debug でも最適化する（しないとテストで 1 ページ 0.5 秒かかる）。
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
