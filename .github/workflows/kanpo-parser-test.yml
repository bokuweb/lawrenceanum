name: kanpo-parser test

# 官報パーサ（crates/kanpo-parser）と PDF リーダ（crates/kanpo-pdf）、後工程（crates/kanpo-lm、モデル無しのテスト）の単体テスト・コーパス・
# 蓄積した官報のスナップショットテスト（tests/archive_snapshots.rs）を、どちらかを触る PR と
# main への push で回す。
on:
  pull_request:
    paths:
      - "crates/kanpo-parser/**"
      - "tools/kanpo-validation/**"
      - "crates/kanpo-parser-wasm/**"
      - "crates/kanpo-docx/**"
      - "crates/kanpo-docx-wasm/**"
      - "crates/kanpo-pdf/**"
      - "crates/kanpo-lm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kanpo-parser-test.yml"
  push:
    branches: [main]
    paths:
      - "crates/kanpo-parser/**"
      - "tools/kanpo-validation/**"
      - "crates/kanpo-parser-wasm/**"
      - "crates/kanpo-docx/**"
      - "crates/kanpo-docx-wasm/**"
      - "crates/kanpo-pdf/**"
      - "crates/kanpo-lm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kanpo-parser-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # スナップショットが変わったら CI では更新せずに落とす（差分は手元で cargo insta review）。
      - name: Test
        env:
          INSTA_UPDATE: "no"
          CI: "true"
        run: cargo test -p kanpo-pdf -p kanpo-parser -p kanpo-parser-wasm -p kanpo-docx -p kanpo-lm --locked
      # 官報 PDF → DOCX はブラウザでも動かす（/kanpo-docx）。WASM でビルドが通ることを確かめる。
      - name: Build kanpo-docx for WASM
        run: cargo build -p kanpo-docx-wasm --target wasm32-unknown-unknown --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install source verification dependencies
        run: python -m pip install -r tools/kanpo-validation/requirements-non-ocr.txt
      - name: Build source verification examples
        run: cargo build --locked -p kanpo-parser --example analyze_media_pdf -p kanpo-pdf --example native_pages --example image_sources
      - name: Verify audit failure detection
        run: python -m unittest discover -s tools/kanpo-validation -p '*_test.py'
      - name: Verify all attached sources without model OCR
        run: python tools/kanpo-validation/check_workbook.py --output .cache/workbook-non-ocr
