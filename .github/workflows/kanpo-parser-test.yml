name: kanpo-parser test

# 官報パーサ（crates/kanpo-parser）と PDF リーダ（crates/kanpo-pdf）、後工程（crates/kanpo-lm、モデル無しのテスト）の単体テスト・コーパス・
# 蓄積した官報のスナップショットテスト（tests/archive_snapshots.rs）を、どちらかを触る PR と
# main への push で回す。
on:
  pull_request:
    paths:
      - "crates/kanpo-parser/**"
      - "crates/kanpo-parser-wasm/**"
      - "crates/kanpo-pdf/**"
      - "crates/kanpo-lm/**"
      - "Cargo.lock"
      - ".github/workflows/kanpo-parser-test.yml"
  push:
    branches: [main]
    paths:
      - "crates/kanpo-parser/**"
      - "crates/kanpo-parser-wasm/**"
      - "crates/kanpo-pdf/**"
      - "crates/kanpo-lm/**"
      - "Cargo.lock"
      - ".github/workflows/kanpo-parser-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # スナップショットが変わったら CI では更新せずに落とす（差分は手元で cargo insta review）。
      - name: Test
        env:
          INSTA_UPDATE: "no"
          CI: "true"
        run: cargo test -p kanpo-pdf -p kanpo-parser -p kanpo-parser-wasm -p kanpo-lm --locked
      # ModernBERT の採点器（candle）がビルドできるか。llama 機能は llama.cpp が要るので CI では見ない。
      - name: Check kanpo-lm (mlm)
        run: cargo check -p kanpo-lm --features mlm --examples --locked
