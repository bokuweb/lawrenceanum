name: publish ndlocr models

# 官報 PDF → DOCX のブラウザ OCR が読むモデルを R2 の ndlocr-models/ へ置く。
# CI と同じ固定 manifest の SHA-256 を検証し、文字集合とライセンスも一緒に配る。
# モデル更新時は checkout の ref と、その revision に含まれる manifest を更新する。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout pinned model manifest and fetcher
        uses: actions/checkout@v4
        with:
          repository: bokuweb/ndlocr-lite-rs
          ref: e9d2670fb163d77d6e166362869056f032be423b
          path: upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/fetch_upstream_assets.py
            /docs/upstream-assets.json

      - name: Fetch and verify pinned models, charset and licenses
        run: |
          python3 upstream/tools/fetch_upstream_assets.py out
          python3 upstream/tools/fetch_upstream_assets.py out --offline
          ls -lh out

      - name: Upload to R2
        run: |
          set -euo pipefail
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets are not set"; exit 1
          fi
          # モデルは名前に版を含むので、長くキャッシュしてよい。
          aws s3 sync out/ "s3://$R2_BUCKET/ndlocr-models/" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 ls "s3://$R2_BUCKET/ndlocr-models/" --endpoint-url "$R2_ENDPOINT"
