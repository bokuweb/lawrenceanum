name: publish ndlocr models

# 官報 PDF → DOCX（/kanpo-docx）のブラウザ OCR（ndlocr-lite-rs の WASM 版）が読むモデルを、R2 の
# `ndlocr-models/` に置く（Pages のビルドは `VITE_NDLOCR_MODEL_BASE` でここを指す）。モデルは
# ndl-lab/ndlocr-lite のリリース（ndlocr-lite-rs の tools/fetch_models_from_ndlocr_release.sh と同じもの、
# CC BY 4.0）。モデルを替えるときだけ手で実行する。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: ndl-lab/ndlocr-lite のリリースのタグ
        default: "1.2.1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch models from the ndlocr-lite release
        run: |
          set -euo pipefail
          mkdir -p work out
          gh release download "${{ inputs.tag }}" -R ndl-lab/ndlocr-lite -p "*windows.zip" -D work
          unzip -o -j work/*windows.zip "*app.zip" -d work >/dev/null || true
          test -f work/app.zip
          unzip -o -j work/app.zip \
            "src/model/deim-s-1024x1024.onnx" \
            "src/model/parseq-ndl-24x256-30-tiny-189epoch-tegaki3-r8data-202604.onnx" \
            "src/model/parseq-ndl-24x384-50-tiny-300epoch-tegaki3-r8data-202604.onnx" \
            "src/model/parseq-ndl-24x768-100-tiny-153epoch-tegaki3-r8data-202604.onnx" \
            "src/config/NDLmoji.yaml" \
            -d out >/dev/null
          unzip -o -j work/app.zip "LICENCE*" "*/LICENCE*" -d out >/dev/null || true
          ls -lh out

      - name: Upload to R2
        run: |
          set -euo pipefail
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets are not set"; exit 1
          fi
          # モデルは名前に版を含むので、長くキャッシュしてよい。
          aws s3 sync out/ "s3://$R2_BUCKET/ndlocr-models/" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 ls "s3://$R2_BUCKET/ndlocr-models/" --endpoint-url "$R2_ENDPOINT"
