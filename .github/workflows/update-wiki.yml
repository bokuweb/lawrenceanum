name: Update LLM wiki

# 配信済みコーパス (Pages の静的 JSON) から、法令に言及した国会・審議会の発言を
# OKF 形式の wiki (専用の orphan ブランチ `wiki`) に日次で積み上げる。
#
#   wiki-plan (決定的)    : 未処理の会議から法令リンクのあるものを最大 N 件選び、抜粋と雛形を作る
#   Claude Code (LLM)     : 抜粋だけを読み、要約・経緯・論点ページを引用付きで書く
#   wiki-finalize (決定的): 時系列・人物・index・log を再生成し、未完了タスクは巻き戻す
#   wiki-check (決定的)   : 引用 (発言 ID の実在・原文一致)・リンク・OKF frontmatter を検証
#                           → 失敗したら 1 回だけ LLM に修正させ、それでも駄目なら push しない
#
# wiki は main と履歴を分けるため orphan ブランチに置く (日次コミットで main を汚さない)。
# 正本は常にコーパス側で、wiki は消して作り直せる派生物。
#
# 必要な設定:
#   Secrets  : CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token` で発行。Pro/Max プランで実行)
#              または ANTHROPIC_API_KEY (従量課金)
#   Variables: WIKI_MODEL (既定 claude-sonnet-5-5) / WIKI_MAX_ITEMS (既定 5) / WIKI_MAX_BILLS (既定 5) / WIKI_MAX_PUBCOMMENTS (既定 3)
on:
  schedule:
    # JST 09:00。法令ワークフロー (JST 06:30) の Pages 配信後に、前日分の会議を取り込む。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "1 回で処理する会議の上限 (コスト上限)"
        required: false
        type: string
      max_bills:
        description: "1 回で要約する議案の上限 (会議とは別枠。0 で議案の要約をしない)"
        required: false
        type: string
      max_pubcomments:
        description: "1 回で要約するパブコメ (結果公示済み) の上限 (別枠。0 で要約しない)"
        required: false
        type: string
      lookback_days:
        description: "何日前までの未処理会議を対象にするか"
        required: false
        default: "45"
        type: string
      push_mode:
        description: "direct = wiki ブランチへ直接 push / pr = wiki 宛ての PR を作る (試運転向け)"
        required: false
        default: "direct"
        type: choice
        options: ["direct", "pr"]
      debug:
        description: "Claude の出力全文をログに出す (失敗原因の調査用。公開リポジトリなのでログは誰でも読める)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # チャンク (4 件) ごとに LLM を呼ぶので、上限を上げた手動実行でも収まるように長めにする。
    timeout-minutes: 150
    env:
      WIKI_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      WIKI_MODEL: ${{ vars.WIKI_MODEL || 'claude-sonnet-5-5' }}
      MAX_ITEMS: ${{ github.event.inputs.max_items || vars.WIKI_MAX_ITEMS || '5' }}
      MAX_BILLS: ${{ github.event.inputs.max_bills || vars.WIKI_MAX_BILLS || '5' }}
      MAX_PUBCOMMENTS: ${{ github.event.inputs.max_pubcomments || vars.WIKI_MAX_PUBCOMMENTS || '3' }}
      # 自治体例規は R2 から配信している。Secret が無ければ例規の照合を飛ばす (週 1 回更新)。
      WIKI_REIKI_BASE_URL: ${{ secrets.R2_PUBLIC_URL && format('{0}/reiki', secrets.R2_PUBLIC_URL) || '' }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '45' }}
      PUSH_MODE: ${{ github.event.inputs.push_mode || 'direct' }}
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out wiki branch
        id: wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin wiki >/dev/null; then
            git fetch --depth=1 origin wiki
            git worktree add -b wiki wiki FETCH_HEAD
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::wiki ブランチが無いので orphan ブランチとして作成します"
            git worktree add --orphan -b wiki wiki
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build lawpub
        run: cargo build --release -p lawpub-cli

      - name: Plan
        id: plan
        run: |
          ./target/release/lawpub wiki-plan \
            --wiki wiki --work .wiki-work \
            --max-items "$MAX_ITEMS" --max-bills "$MAX_BILLS" --max-pubcomments "$MAX_PUBCOMMENTS" --lookback-days "$LOOKBACK_DAYS"
          echo "tasks=$(jq '.tasks | length' .wiki-work/plan.json)" >> "$GITHUB_OUTPUT"
          cat .wiki-work/plan.md >> "$GITHUB_STEP_SUMMARY"

      # Claude には wiki/ の編集と読み取りだけを許す。Bash とネットワークは渡さない
      # (会議録は外部由来のテキストなので、プロンプトインジェクションの影響範囲を最小にする)。
      # Claude には wiki/ の編集と読み取りだけを許す。Bash とネットワークは渡さない
      # (会議録は外部由来のテキストなので、プロンプトインジェクションの影響範囲を最小にする)。
      # 一度に何十件も渡すと途中で作業を切り上げてしまうので、wiki-plan が分けたチャンク
      # (.wiki-work/chunks/NNN.md、既定 4 件) ごとに、まっさらな状態の Claude Code を呼ぶ。
      - name: Setup Node (Claude Code CLI)
        if: steps.plan.outputs.tasks != '0' && env.HAS_CLAUDE_AUTH == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        if: steps.plan.outputs.tasks != '0' && env.HAS_CLAUDE_AUTH == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write wiki pages (Claude Code, per chunk)
        if: steps.plan.outputs.tasks != '0' && env.HAS_CLAUDE_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEBUG_OUTPUT: ${{ github.event.inputs.debug == 'true' }}
        run: |
          # 空の Secret は未設定として扱う (空の API キーが OAuth より優先されないように)。
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          echo "### Claude Code (チャンクごと)" >> "$GITHUB_STEP_SUMMARY"
          for f in .wiki-work/chunks/*.md; do
            prompt="\`.github/wiki-agent.md\` の指示に従い、\`$f\` に載っている全タスクを最後まで処理して wiki を更新してください。
          ソースバンドル (\`.wiki-work/sources/\`) の抜粋だけを根拠にし、引用ルールを厳守してください。途中で作業を切り上げないこと。"
            if claude -p "$prompt" \
                --model "$WIKI_MODEL" \
                --max-turns 40 \
                --permission-mode dontAsk \
                --allowedTools "Read,Glob,Grep,Edit(wiki/**),Write(wiki/**),MultiEdit(wiki/**)" \
                --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit" \
                --output-format json > "$f.result.json" 2> "$f.err"; then
              jq -r --arg f "$f" '"- \($f): \(.num_turns) turns, $\(.total_cost_usd), is_error=\(.is_error)"' "$f.result.json" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              # 1 チャンクの失敗で他を止めない (未完了のタスクは finalize が翌日に回す)。
              echo "::warning::$f の処理に失敗: $(tail -c 500 "$f.err")"
              echo "- $f: 失敗" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$DEBUG_OUTPUT" = "true" ]; then jq -r '.result // empty' "$f.result.json" 2>/dev/null || true; fi
          done

      - name: Finalize
        run: ./target/release/lawpub wiki-finalize --wiki wiki --work .wiki-work

      - name: Check
        id: check
        continue-on-error: true
        run: ./target/release/lawpub wiki-check --wiki wiki --work .wiki-work --changed

      # 検証エラーは 1 回だけ LLM に直させる (引用の引き直し、または該当記述の削除)。
      - name: Repair (Claude Code)
        if: steps.check.outcome == 'failure' && env.HAS_CLAUDE_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code
          claude -p "\`.wiki-work/check-report.md\` に wiki の検証エラーがあります。\`.github/wiki-agent.md\` の引用ルールに従って、
          エラーになった箇所だけを直してください。引用が原文と一致しない場合は、ソースバンドル
          (\`.wiki-work/sources/\`) の \`text\` から正しい一節を引き直すか、根拠を示せない記述ごと削除してください。" \
            --model "$WIKI_MODEL" \
            --max-turns 20 \
            --permission-mode dontAsk \
            --allowedTools "Read,Glob,Grep,Edit(wiki/**),Write(wiki/**),MultiEdit(wiki/**)" \
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --output-format json > .wiki-work/repair.result.json || echo "::warning::修正パスに失敗"
          jq -r '"修正パス: \(.num_turns) turns, $\(.total_cost_usd)"' .wiki-work/repair.result.json 2>/dev/null || true

      - name: Re-check after repair
        if: steps.check.outcome == 'failure'
        run: |
          ./target/release/lawpub wiki-finalize --wiki wiki --work .wiki-work
          ./target/release/lawpub wiki-check --wiki wiki --work .wiki-work --changed

      - name: Report
        if: always()
        run: |
          [ -f .wiki-work/check-report.md ] && cat .wiki-work/check-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit and push
        run: |
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::wiki に変更なし"
            exit 0
          fi
          date=$(jq -r '.date' ../.wiki-work/plan.json)
          n=$(jq '.tasks | length' ../.wiki-work/plan.json)
          git commit -q -m "wiki: ${date} (${n} tasks planned)" -m "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PUSH_MODE" = "pr" ] && [ "${{ steps.wiki.outputs.exists }}" = "true" ]; then
            branch="wiki-update/${date}-${{ github.run_id }}"
            git push origin "HEAD:refs/heads/${branch}"
            {
              cat ../.wiki-work/plan.md
              echo
              cat ../.wiki-work/check-report.md 2>/dev/null || true
              echo
              echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            } > ../.wiki-work/pr-body.md
            gh pr create --base wiki --head "$branch" --title "wiki: ${date}" --body-file ../.wiki-work/pr-body.md
          else
            git push origin HEAD:refs/heads/wiki
          fi
        env:
          GH_TOKEN: ${{ github.token }}
