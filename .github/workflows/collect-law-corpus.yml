name: Collect law corpus updates

# 法令の取得を、検索 DB / Pages の重い再構築から分離する。
# update-law-data.yml が途中で停止しても、内容ハッシュで重複排除した更新 XML・
# revision meta と収集 cursor は R2 の差分オーバーレイに残る。
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "開始日 YYYY-MM-DD（空なら durable cursor - 3日）"
        required: false
        type: string
      to_date:
        description: "終了日 YYYY-MM-DD（空なら最大31日または今日）"
        required: false
        type: string
      sync_current_bodies:
        description: "e-Gov の現行版一覧と突き合わせ、欠けている現行版本文・改正履歴メタ・法令を取得する"
        required: false
        default: true
        type: boolean
      sync_limit:
        description: "(現行版本文の同期) 処理する法令数の上限。空なら全件"
        required: false
        type: string
  schedule:
    # JST 02:00 毎日。05:00 corpus / 06:30 law deploy より前に永続化する。
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: collect-law-corpus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # durable production archive へ mock データを混入させないため固定する。
      LAWPUB_PROVIDER: http
      LAWPUB_EGOV_BASE_URL: https://laws.e-gov.go.jp/api/1
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      DELTA_CACHE: .law-corpus-delta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require durable R2 storage
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 secrets are required; refusing an ephemeral collection run"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build lawpub
        run: cargo build --release -p lawpub-cli

      # この archive は base revisions.tar.zst 以降の追記層。小さい更新集合だけを
      # 再圧縮するため、32GB の base コーパスを毎日固め直す必要がない。
      - name: Restore durable law delta from R2
        run: |
          mkdir -p "$DELTA_CACHE"
          if aws s3 cp "s3://$R2_BUCKET/law-corpus-delta.tar.zst" /tmp/law-corpus-delta.tar.zst \
            --endpoint-url "$R2_ENDPOINT" 2>/dev/null; then
            zstd -dc --long=31 /tmp/law-corpus-delta.tar.zst | tar -x -C "$DELTA_CACHE"
            rm -f /tmp/law-corpus-delta.tar.zst
            echo "::notice::restored durable law corpus delta"
          else
            echo "::notice::no law corpus delta yet; seeding cursor from state/latest.json"
          fi

      - name: Resolve bounded collection range
        id: range
        env:
          INPUT_FROM: ${{ github.event.inputs.from_date }}
          INPUT_TO: ${{ github.event.inputs.to_date }}
        run: |
          state="$DELTA_CACHE/state/law_collection.json"
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if [ -n "$INPUT_FROM" ]; then
            from="$INPUT_FROM"
          else
            last=$(jq -r '.latest_successful_update_date // empty' "$state" 2>/dev/null || true)
            if [ -z "$last" ]; then
              last=$(jq -r '.latest_successful_update_date // empty' state/latest.json 2>/dev/null || true)
            fi
            if [ -n "$last" ]; then
              from=$(date -u -d "$last - 3 days" +%Y-%m-%d)
            else
              from="$today"
            fi
          fi

          if [ -n "$INPUT_TO" ]; then
            to="$INPUT_TO"
          else
            bounded=$(date -u -d "$from + 30 days" +%Y-%m-%d)
            if [[ "$bounded" < "$today" ]]; then to="$bounded"; else to="$today"; fi
          fi
          if [[ "$from" > "$to" ]]; then
            echo "::error::invalid range: $from > $to"
            exit 1
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "::notice::law collection range $from..$to (today=$today)"

      - name: Fetch law updates into delta cache
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          before=$(find "$DELTA_CACHE/revisions" -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
          current="$FROM"
          while [[ "$current" < "$TO" || "$current" == "$TO" ]]; do
            ./target/release/lawpub fetch-update \
              --date "$current" --cache "$DELTA_CACHE" --provider "$LAWPUB_PROVIDER"
            current=$(date -u -d "$current + 1 day" +%Y-%m-%d)
          done
          after=$(find "$DELTA_CACHE/revisions" -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::durable delta revisions: $before -> $after"

      # 現行版本文の同期に使う「base コーパス (R2) に既にある meta / 本文」を用意する。
      # 32GB の本文は展開せず、tar の一覧だけを取る (存在確認に使う)。
      - name: Restore base revisions meta and corpus listing from R2
        if: github.event_name == 'schedule' || github.event.inputs.sync_current_bodies != 'false'
        run: |
          mkdir -p .law-base/revisions_meta
          if aws s3 cp "s3://$R2_BUCKET/revisions_meta.jsonl" /tmp/revisions_meta.jsonl \
            --endpoint-url "$R2_ENDPOINT" 2>/dev/null; then
            ./target/release/lawpub bundle-revisions-meta --mode unpack \
              --file /tmp/revisions_meta.jsonl --dir .law-base/revisions_meta
            rm -f /tmp/revisions_meta.jsonl
          else
            echo "::warning::revisions_meta.jsonl not found in R2"
          fi
          if aws s3 cp "s3://$R2_BUCKET/revisions.tar.zst" /tmp/revisions.tar.zst \
            --endpoint-url "$R2_ENDPOINT" 2>/dev/null; then
            zstd -dc --long=31 /tmp/revisions.tar.zst | tar -t > .law-base/files.txt
            rm -f /tmp/revisions.tar.zst
          else
            echo "::warning::revisions.tar.zst not found in R2"
            : > .law-base/files.txt
          fi
          echo "::notice::base meta $(ls .law-base/revisions_meta | wc -l) laws, base corpus $(grep -c '\.xml$' .law-base/files.txt) XMLs"

      # 施行日を迎えて版が切り替わった法令は日次の更新一覧に載らないことがあり、
      # 手元の本文が改正前のまま残る。e-Gov v2 /laws の現行版 ID と突き合わせ、
      # 欠けている現行版本文 (/law_data/{revision_id})・古い改正履歴メタ・手元に無い
      # 現行法令だけを delta に取得する。並列 4・リトライ付き。失敗しても取得済み分は
      # delta に残し、cursor の更新と upload は続ける。
      - name: Sync current revision bodies into delta cache
        if: github.event_name == 'schedule' || github.event.inputs.sync_current_bodies != 'false'
        env:
          SYNC_LIMIT: ${{ github.event.inputs.sync_limit }}
        run: |
          mkdir -p "$DELTA_CACHE/state"
          # base meta が復元できていないと全法令を「手元に無い」と判定して全件取得に
          # なるので、その場合は同期しない (e-Gov への過負荷防止)。
          base_meta=$(find .law-base/revisions_meta -name '*.json' | wc -l | tr -d ' ')
          if [ "$base_meta" -lt 1000 ]; then
            echo "::warning::base revisions meta is missing ($base_meta laws); skipping current body sync"
            exit 0
          fi
          ARGS=(sync-current-bodies --cache "$DELTA_CACHE" --lookup .law-base
                --existing-list .law-base/files.txt --concurrency 4
                --report "$DELTA_CACHE/state/sync_current_bodies.json")
          if [ -n "$SYNC_LIMIT" ]; then ARGS+=(--limit "$SYNC_LIMIT"); fi
          if ! ./target/release/lawpub "${ARGS[@]}"; then
            echo "::warning::sync-current-bodies failed; uploading what was fetched"
          fi
          if [ -f "$DELTA_CACHE/state/sync_current_bodies.json" ]; then
            jq -r '"::notice::current bodies: meta \(.meta_refreshed|length), bodies \(.bodies_fetched|length), new laws \(.new_laws|length), errors \(.errors|length) (planned \(.planned))"' \
              "$DELTA_CACHE/state/sync_current_bodies.json"
          fi

      # upload が成功した run だけ cursor を進める。archive 内にも state を含め、
      # git commit の競合や Actions cache eviction に依存しない。
      - name: Save cursor and upload durable delta
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          mkdir -p "$DELTA_CACHE/state"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg from "$FROM" --arg to "$TO" --arg now "$now" --arg provider "$LAWPUB_PROVIDER" \
            '{version:1, latest_successful_update_date:$to, last_range:{from:$from,to:$to}, last_run_at:$now, provider:$provider}' \
            > "$DELTA_CACHE/state/law_collection.json"

          # egov/{date}/*.xml は「どの日にどの法令が更新されたか」の唯一の記録。
          # build-json は updates/{date}.json と updates/latest.json をここからしか
          # 作らないため、除外すると新着・更新トレンドが base コーパスの日付で止まる。
          # revisions と同じ原本の複製だが、delta は日次更新分だけなので容量は小さい。
          mkdir -p "$DELTA_CACHE/revisions" "$DELTA_CACHE/revisions_meta" "$DELTA_CACHE/egov"
          ( cd "$DELTA_CACHE" && \
            tar -cf - revisions revisions_meta egov state | \
            zstd -12 -T0 -o /tmp/law-corpus-delta.tar.zst -f )
          ls -lh /tmp/law-corpus-delta.tar.zst
          aws s3 cp /tmp/law-corpus-delta.tar.zst "s3://$R2_BUCKET/law-corpus-delta.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          aws s3 cp "$DELTA_CACHE/state/law_collection.json" "s3://$R2_BUCKET/law-collection-state.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/json' \
            --cache-control 'public, max-age=300'
          echo "::notice::law corpus delta and cursor persisted to R2"
