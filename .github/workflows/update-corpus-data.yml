name: Update corpus data

# 国会会議録・パブコメ・調達・議案・通達・審議会を定期取得し、生キャッシュを R2 に
# アップロードする。
# **このワークフローは Pages へ deploy しない。** 配信は法令ワークフロー
# (update-law-data.yml) が R2 の各キャッシュを取り込んで laws と一緒に 1 つの
# public/ で行う (2 ワークフローが別々に Pages を上げると互いを clobber するため)。
#
# スケジュール: JST 毎朝 05:00 (UTC 20:00 前日)
#   - 法令 (06:30 JST) より早めに取得・R2 へ上げ、後続の法令 run が取り込めるようにする。
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "provider (http | mock)"
        required: false
        default: "http"
        type: choice
        options: ["http", "mock"]
      domains:
        description: "カンマ区切りドメイン (kokkai,pubcomment,procurement,gian,tsutatsu,shingikai,budget,hanrei,shitsumon,guidance,jlt) / 空=全て。自治体例規は collect-reiki.yml"
        required: false
        type: string
      kokkai_session:
        description: "国会回次 (空=直近3会期を自動算出)"
        required: false
        type: string
      hanrei_from:
        description: "判例の取得開始日 YYYY-MM-DD (空=直近60日)。過去分のバックフィル用"
        required: false
        type: string
      hanrei_to:
        description: "判例の取得終了日 YYYY-MM-DD (空=今日)"
        required: false
        type: string
      shitsumon_session:
        description: "質問主意書の回次 (例: 219 / 210-219。空=最新と1つ前)。過去分のバックフィル用"
        required: false
        type: string
  schedule:
    # JST 05:00 毎日
    - cron: "0 20 * * *"
    # フォールバック (JST 08:00): 05:00 の run が Runner 未割当などで失敗した日だけ
    # 再取得する。成功済み / 実行中の run があれば guard job で skip する。
    # 法令ワークフローは 1 日複数回 R2 を取り込むので、次の法令 run で配信される。
    - cron: "0 23 * * *"

permissions:
  # Pages へは deploy しない (法令ワークフローが配信)。state コミットと R2 upload のみ。
  contents: write
  # guard job が当日の run 状況を参照する。
  actions: read

concurrency:
  group: update-corpus-data
  cancel-in-progress: false

jobs:
  # フォールバック cron の run だけ、当日 (UTC 19:00 以降) に成功済み or 実行中の
  # run があれば update を skip する。通常 cron / 手動実行は常に update する。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check earlier runs today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" != "0 23 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u +%Y-%m-%d)T19:00:00Z"
          covered=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-corpus-data.yml \
            --created ">=$since" --limit 20 --json databaseId,status,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == \"success\" or .status != \"completed\")] | length")
          if [ "$covered" -gt 0 ]; then
            echo "::notice::today's corpus run already succeeded or is running — skipping fallback"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no successful corpus run since $since — running fallback"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAWPUB_PROVIDER: ${{ github.event.inputs.provider || 'http' }}
      DOMAINS: ${{ github.event.inputs.domains || 'kokkai,pubcomment,procurement,gian,tsutatsu,shingikai,budget,hanrei,shitsumon,guidance,jlt' }}
      # 未設定なら budget step は安全に skip。Secret 追加後の次回runから自動収集する。
      LAWPUB_ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Restore corpus cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: corpus-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            corpus-cache-v1-${{ runner.os }}-

      # Actions cache は揮発・容量制限付きなので、cache miss の run が直近分だけを
      # R2 へ上書きすると過去コーパスが消える。各 fetch の前に R2 の last-good を
      # top-up し、R2 を追記型コーパスの source of truth にする。
      - name: Restore durable corpus caches from R2
        if: env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          restore_bundle() {
            object="$1"
            target="$2"
            archive="/tmp/${object}"
            mkdir -p "$target"
            if aws s3 cp "s3://$R2_BUCKET/$object" "$archive" --endpoint-url "$R2_ENDPOINT" 2>/dev/null; then
              # Actions cache に R2 より新しいファイルがある場合は温存する。
              zstd -dc --long=31 "$archive" | tar -x --skip-old-files -C "$target"
              rm -f "$archive"
              echo "::notice::restored $object into $target"
            else
              echo "::notice::$object not found in R2 — starting this domain from available cache"
            fi
          }
          restore_bundle proceedings-cache.tar.zst .cache/proceedings
          restore_bundle pubcomment-cache.tar.zst .cache/pubcomment
          restore_bundle pubcomment-assets.tar.zst .cache/pubcomment-assets
          restore_bundle gian-cache.tar.zst .cache/gian
          restore_bundle gian-assets.tar.zst .cache/gian-assets
          restore_bundle gian-history.tar.zst .cache/gian-history
          restore_bundle gian-resolutions.tar.zst .cache/gian-resolutions
          restore_bundle gian-resolution-assets.tar.zst .cache/gian-resolution-assets
          restore_bundle tsutatsu-cache.tar.zst .cache/tsutatsu
          restore_bundle procurement-cache.tar.zst .cache/procurement
          restore_bundle shingikai-cache.tar.zst .cache/shingikai
          restore_bundle shingikai-assets.tar.zst .cache/shingikai-assets
          restore_bundle shingikai-history.tar.zst .cache/shingikai-history
          restore_bundle budget-cache.tar.zst .cache/budget
          restore_bundle hanrei-cache.tar.zst .cache/hanrei
          # 過去分は backfill-hanrei.yml が別オブジェクトに貯める。ここで合わせて復元し、
          # 日次の hanrei-cache にも取り込む。
          restore_bundle hanrei-backfill.tar.zst .cache/hanrei
          restore_bundle shitsumon-cache.tar.zst .cache/shitsumon
          restore_bundle guidance-cache.tar.zst .cache/guidance
          restore_bundle guidance-assets.tar.zst .cache/guidance-assets
          restore_bundle jlt-cache.tar.zst .cache/jlt

      - name: Build lawpub
        run: cargo build --release -p lawpub-cli

      # パブコメ・政府解釈の添付 PDF の原本保存・全文抽出に使用する。
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # ── 国会会議録 ───────────────────────────────────────────────

      - name: Fetch kokkai (直近 3 会期)
        id: fetch_kokkai
        if: contains(env.DOMAINS, 'kokkai') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          provider="${LAWPUB_PROVIDER}"
          # 会期番号: 入力があればそれ、なければ直近 3 会期を推定
          if [ -n "${{ github.event.inputs.kokkai_session }}" ]; then
            sessions="${{ github.event.inputs.kokkai_session }}"
          else
            # 現在の最新会期を kokkai API から取得し直近 3 会期を算出。
            # meeting_list は検索条件必須なので「直近60日の日付範囲」で引き、その中の
            # 最大 session を採る (旧コードは無条件 meeting_list で叩いていたが
            # HTTP 400「検索条件を指定してください」になり latest が空 → "-2,-1," と
            # なって何も取得できていなかった)。失敗時は安全側の固定値にフォールバック。
            from=$(date -u -d "60 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-60d +%Y-%m-%d)
            until=$(date -u +%Y-%m-%d)
            latest=$(curl -sf "https://kokkai.ndl.go.jp/api/meeting_list?from=$from&until=$until&maximumRecords=100&recordPacking=json" \
              | jq -r '[.meetingRecord[].session] | max // empty' 2>/dev/null || true)
            if ! [ "${latest:-0}" -gt 0 ] 2>/dev/null; then
              echo "::warning::最新会期の自動検出に失敗 — フォールバック 221 を使用"
              latest=221
            fi
            sessions="$((latest-2)),$((latest-1)),$latest"
          fi
          echo "::notice::kokkai sessions: $sessions"
          failed=0
          for s in ${sessions//,/ }; do
            ./target/release/lawpub proceedings-fetch \
              --session "$s" --cache .cache --provider "$provider" || failed=1
          done
          exit "$failed"

      - name: Build kokkai JSON
        if: contains(env.DOMAINS, 'kokkai') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          [ -d .cache/proceedings ] || { echo "::notice::no kokkai cache, skip"; exit 0; }
          mkdir -p public
          ./target/release/lawpub proceedings-build-json \
            --cache .cache --public public

      # ── 議事録キャッシュを R2 へ (法令ワークフローが配信元) ───────────
      # このワークフローは Pages へ deploy しない (法令ワークフロー update-law-data.yml が
      # laws と一緒に 1 つの public/ で配信する。2 ワークフローが別々に Pages を上げると
      # 互いを clobber するため)。ここでは生 kokkai キャッシュ (.cache/proceedings) を
      # zstd tar にして R2 (proceedings-cache.tar.zst) に置き、法令ワークフローの
      # 「Build proceedings from R2 cache」が取得 → build → link → 同梱 deploy する。
      # 会期の生 JSON は GH Actions cache (揮発) に依存せず R2 を真の source にする。
      - name: Upload proceedings cache to R2
        id: upload_kokkai
        if: (contains(env.DOMAINS, 'kokkai') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/proceedings ] || { echo "::notice::no proceedings cache, skip R2 upload"; exit 0; }
          n=$(find .cache/proceedings -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./{session}/ にするため .cache/proceedings 内から固める。
          ( cd .cache/proceedings && tar -cf - . | zstd -19 --long -T0 -o /tmp/proceedings-cache.tar.zst -f )
          ls -lh /tmp/proceedings-cache.tar.zst
          aws s3 cp /tmp/proceedings-cache.tar.zst "s3://$R2_BUCKET/proceedings-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded proceedings cache to R2 ($n meeting files)"

      # ── パブコメ ─────────────────────────────────────────────────

      - name: Fetch pubcomment
        id: fetch_pubcomment
        if: contains(env.DOMAINS, 'pubcomment') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          # both = 意見募集中(締切前) + 結果公示済み。募集中は締切アラートの要。
          ./target/release/lawpub pubcomment-fetch \
            --cache .cache --provider "${LAWPUB_PROVIDER}" --max-pages 50 --status both \
            --fetch-attachments

      - name: Build pubcomment JSON
        if: contains(env.DOMAINS, 'pubcomment') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          [ -d .cache/pubcomment ] || { echo "::notice::no pubcomment cache, skip"; exit 0; }
          mkdir -p public
          ./target/release/lawpub pubcomment-build-json \
            --cache .cache --public public

      # ── パブコメキャッシュを R2 へ (法令ワークフローが配信元) ─────────
      # proceedings と同じ方式。このワークフローは Pages へ deploy せず、法令ワークフロー
      # (update-law-data.yml) が R2 の pubcomment-cache.tar.zst を取得 → build-json →
      # link-laws-and-pubcomment して laws と同梱 deploy する。法令 ↔ パブコメの link は
      # public/laws/index.json が必要で、それが揃うのは法令ワークフロー側のため、ここでは
      # 生 pubcomment キャッシュ (.cache/pubcomment/{case_id}.json) を上げるまでが責務。
      - name: Upload pubcomment cache to R2
        id: upload_pubcomment
        if: (contains(env.DOMAINS, 'pubcomment') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/pubcomment ] || { echo "::notice::no pubcomment cache, skip R2 upload"; exit 0; }
          n=$(find .cache/pubcomment -name '*.json' | wc -l | tr -d ' ')
          if [ "${n:-0}" -eq 0 ]; then
            echo "::warning::pubcomment cache is empty — keeping the last-good R2 bundle"
            exit 0
          fi
          # top-level を ./{case_id}.json にするため .cache/pubcomment 内から固める。
          ( cd .cache/pubcomment && tar -cf - . | zstd -19 --long -T0 -o /tmp/pubcomment-cache.tar.zst -f )
          ls -lh /tmp/pubcomment-cache.tar.zst
          aws s3 cp /tmp/pubcomment-cache.tar.zst "s3://$R2_BUCKET/pubcomment-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded pubcomment cache to R2 ($n cases)"

      # 添付原本は配信用 JSON と分離して保存する。案件 JSON には sha256・抽出全文が入り、
      # 原本はこの durable archive から次回 run に復元される。
      - name: Upload pubcomment attachment originals to R2
        if: (contains(env.DOMAINS, 'pubcomment') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/pubcomment-assets ] || { echo "::notice::no pubcomment assets, skip"; exit 0; }
          n=$(find .cache/pubcomment-assets -type f | wc -l | tr -d ' ')
          ( cd .cache/pubcomment-assets && tar -cf - . | zstd -19 --long -T0 -o /tmp/pubcomment-assets.tar.zst -f )
          aws s3 cp /tmp/pubcomment-assets.tar.zst "s3://$R2_BUCKET/pubcomment-assets.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded pubcomment attachment originals to R2 ($n files)"

      # ── 議案 (法案審議トラッキング) ───────────────────────────────
      - name: Fetch gian
        id: fetch_gian
        if: contains(env.DOMAINS, 'gian') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          # session=0 = 最新会期 (継続審議は審議経過の議案提出回次から正しい会期に)。
          ./target/release/lawpub gian-fetch \
            --cache .cache --provider "${LAWPUB_PROVIDER}" --session 0

      - name: Upload gian cache to R2
        id: upload_gian
        if: (contains(env.DOMAINS, 'gian') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/gian ] || { echo "::notice::no gian cache, skip R2 upload"; exit 0; }
          n=$(find .cache/gian -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./{session}/{bill_id}.json にするため .cache/gian 内から固める。
          ( cd .cache/gian && tar -cf - . | zstd -19 --long -T0 -o /tmp/gian-cache.tar.zst -f )
          aws s3 cp /tmp/gian-cache.tar.zst "s3://$R2_BUCKET/gian-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded gian cache to R2 ($n bills)"

      - name: Upload gian document originals and history to R2
        if: (contains(env.DOMAINS, 'gian') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          upload_bundle() {
            source="$1"
            object="$2"
            [ -d "$source" ] || { echo "::notice::no $source, skip $object"; return; }
            archive="/tmp/$object"
            ( cd "$source" && tar -cf - . | zstd -19 --long -T0 -o "$archive" -f )
            aws s3 cp "$archive" "s3://$R2_BUCKET/$object" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type 'application/zstd' \
              --cache-control 'public, max-age=300'
          }
          upload_bundle .cache/gian-assets gian-assets.tar.zst
          upload_bundle .cache/gian-history gian-history.tar.zst
          upload_bundle .cache/gian-resolutions gian-resolutions.tar.zst
          upload_bundle .cache/gian-resolution-assets gian-resolution-assets.tar.zst

      # ── 通達 (国税庁 法令解釈通達 soft law) ───────────────────────
      - name: Fetch tsutatsu
        id: fetch_tsutatsu
        if: contains(env.DOMAINS, 'tsutatsu') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          # 所得税・法人税・消費税の各基本通達 (全ページ)。著作権法13条で通達に
          # 著作権なし・国税庁は PDL1.0 (CC BY 互換) で再配布可 (出典明記)。
          ./target/release/lawpub tsutatsu-fetch \
            --cache .cache --provider "${LAWPUB_PROVIDER}" --max-pages 0

      - name: Upload tsutatsu cache to R2
        id: upload_tsutatsu
        if: (contains(env.DOMAINS, 'tsutatsu') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/tsutatsu ] || { echo "::notice::no tsutatsu cache, skip R2 upload"; exit 0; }
          n=$(find .cache/tsutatsu -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./{tax}.json にするため .cache/tsutatsu 内から固める。
          ( cd .cache/tsutatsu && tar -cf - . | zstd -19 --long -T0 -o /tmp/tsutatsu-cache.tar.zst -f )
          aws s3 cp /tmp/tsutatsu-cache.tar.zst "s3://$R2_BUCKET/tsutatsu-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded tsutatsu cache to R2 ($n sets)"

      # ── 判例 (裁判所 裁判例検索) ──────────────────────────────────
      - name: Fetch hanrei
        id: fetch_hanrei
        if: contains(env.DOMAINS, 'hanrei') || env.DOMAINS == ''
        continue-on-error: true
        env:
          HANREI_FROM: ${{ github.event.inputs.hanrei_from }}
          HANREI_TO: ${{ github.event.inputs.hanrei_to }}
        run: |
          # robots.txt は /hanrei/ を許可。サイト規約は著作権法上認められた利用を許し
          # 改変を禁じるため、判示事項等は原文のまま保持して出典 URL を付ける。
          # 保存済みの事件は飛ばすので、--limit で打ち切っても次回 run が続きから取る。
          from="${HANREI_FROM:-$(date -u -d '60 days ago' +%F)}"
          to="${HANREI_TO:-$(date -u +%F)}"
          ./target/release/lawpub hanrei-fetch \
            --cache .cache --from "$from" --to "$to" --limit 1500 --interval-ms 1000

      - name: Upload hanrei cache to R2
        id: upload_hanrei
        if: (contains(env.DOMAINS, 'hanrei') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/hanrei ] || { echo "::notice::no hanrei cache, skip R2 upload"; exit 0; }
          n=$(find .cache/hanrei -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./{case_id}.json にするため .cache/hanrei 内から固める。
          ( cd .cache/hanrei && tar -cf - . | zstd -19 --long -T0 -o /tmp/hanrei-cache.tar.zst -f )
          aws s3 cp /tmp/hanrei-cache.tar.zst "s3://$R2_BUCKET/hanrei-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded hanrei cache to R2 ($n cases)"

      # ── 質問主意書・答弁書 (衆議院 質問答弁情報 / 参議院 質問主意書) ─────────
      - name: Fetch shitsumon
        id: fetch_shitsumon
        if: contains(env.DOMAINS, 'shitsumon') || env.DOMAINS == ''
        continue-on-error: true
        env:
          SHITSUMON_SESSION: ${{ github.event.inputs.shitsumon_session }}
        run: |
          # robots.txt は両院とも不在。サイト規約は出所明示での引用・転載・複製を許し改変を
          # 禁じるため、本文は原文のまま保持して出典 URL を付ける。
          # 答弁済みの保存分は飛ばすので、--limit で打ち切っても次回 run が続きから取る。
          # 1 件につき経過・質問・答弁の最大 3 リクエスト (1 秒間隔) なので 400 件で約 20 分。
          args=()
          [ -n "$SHITSUMON_SESSION" ] && args+=(--session "$SHITSUMON_SESSION")
          ./target/release/lawpub shitsumon-fetch \
            --cache .cache "${args[@]}" --limit 400 --interval-ms 1000

      - name: Upload shitsumon cache to R2
        id: upload_shitsumon
        if: (contains(env.DOMAINS, 'shitsumon') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/shitsumon ] || { echo "::notice::no shitsumon cache, skip R2 upload"; exit 0; }
          n=$(find .cache/shitsumon -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./{house}/{session}/{number}.json にするため .cache/shitsumon 内から固める。
          ( cd .cache/shitsumon && tar -cf - . | zstd -19 --long -T0 -o /tmp/shitsumon-cache.tar.zst -f )
          aws s3 cp /tmp/shitsumon-cache.tar.zst "s3://$R2_BUCKET/shitsumon-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded shitsumon cache to R2 ($n questions)"

      # ── 政府解釈 (金融庁 ノーアクションレター・書面照会・相談事例・Q&A・ガイドライン) ──
      - name: Fetch guidance
        id: fetch_guidance
        if: contains(env.DOMAINS, 'guidance') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          # 金融庁サイトは PDL1.0 (出典明記・加工の旨を記載すれば再配布可)、robots.txt は不在。
          # 一覧の巡回が約 22 リクエスト、文書ごとに照会書・回答書の最大 2 ファイル。
          # 取得済みのノーアクションレターは取り直さず、Q&A・ガイドラインは 7 日ごとに取り直す。
          # 2 秒間隔・1 run 120 文書まで (初回は約 10 分、以後は数分)。
          ./target/release/lawpub guidance-fetch \
            --cache .cache --ministry fsa --interval-ms 2000 --limit 120 --refresh-days 7

      - name: Upload guidance cache to R2
        id: upload_guidance
        if: (contains(env.DOMAINS, 'guidance') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/guidance ] || { echo "::notice::no guidance cache, skip R2 upload"; exit 0; }
          upload_bundle() {
            source="$1"
            object="$2"
            [ -d "$source" ] || { echo "::notice::no $source, skip $object"; return; }
            archive="/tmp/$object"
            ( cd "$source" && tar -cf - . | zstd -19 --long -T0 -o "$archive" -f )
            aws s3 cp "$archive" "s3://$R2_BUCKET/$object" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type 'application/zstd' \
              --cache-control 'public, max-age=300'
          }
          n=$(find .cache/guidance -name '*.json' ! -name '._*' | wc -l | tr -d ' ')
          # top-level を ./{ministry}/{id}.json / ./{ministry}/{sha256}.{ext} にする。
          upload_bundle .cache/guidance guidance-cache.tar.zst
          upload_bundle .cache/guidance-assets guidance-assets.tar.zst
          echo "::notice::uploaded guidance cache to R2 ($n documents)"

      # ── 法令英訳 (法務省 日本法令外国語訳データベース) ─────────────────────
      - name: Fetch jlt
        id: fetch_jlt
        if: contains(env.DOMAINS, 'jlt') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          # 利用規約は PDL1.0 (出典・加工の旨の記載で再配布可)。robots.txt は不在。
          # 一覧 (12 分野・約 25 ページ) は毎回引き直し、本文は未取得の翻訳版 ID だけ取る
          # (翻訳が更新されると ID が変わる)。2 秒間隔・1 run 200 件までで、全約 1,000 件の
          # バックフィルは数日の定期 run で終わる。
          ./target/release/lawpub jlt-fetch \
            --cache .cache --limit 200 --interval-ms 2000

      - name: Upload jlt cache to R2
        id: upload_jlt
        if: (contains(env.DOMAINS, 'jlt') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -f .cache/jlt/list.json ] || { echo "::notice::no jlt cache, skip R2 upload"; exit 0; }
          n=$(find .cache/jlt/laws -name '*.json' | wc -l | tr -d ' ')
          # top-level を ./list.json + ./laws/{jlt_id}.json にするため .cache/jlt 内から固める。
          ( cd .cache/jlt && tar -cf - . | zstd -19 --long -T0 -o /tmp/jlt-cache.tar.zst -f )
          aws s3 cp /tmp/jlt-cache.tar.zst "s3://$R2_BUCKET/jlt-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded jlt cache to R2 ($n translations)"

      # ── 調達情報 ─────────────────────────────────────────────────

      - name: Fetch procurement (直近 30 日)
        id: fetch_procurement
        if: contains(env.DOMAINS, 'procurement') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          from=$(date -u -d "30 days ago" +%Y-%m-%d 2>/dev/null || date -v-30d +%Y-%m-%d)
          to=$(date -u +%Y-%m-%d)
          ./target/release/lawpub procurement-fetch \
            --from "$from" --to "$to" \
            --cache .cache --provider "${LAWPUB_PROVIDER}"

      - name: Build procurement JSON
        if: contains(env.DOMAINS, 'procurement') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          [ -d .cache/procurement ] || { echo "::notice::no procurement cache, skip"; exit 0; }
          mkdir -p public
          ./target/release/lawpub procurement-build-json \
            --cache .cache --public public

      - name: Upload procurement cache to R2
        id: upload_procurement
        if: (contains(env.DOMAINS, 'procurement') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/procurement ] || { echo "::notice::no procurement cache, skip R2 upload"; exit 0; }
          n=$(find .cache/procurement -name '*.json' | wc -l | tr -d ' ')
          if [ "${n:-0}" -eq 0 ]; then
            echo "::warning::procurement cache is empty — keeping the last-good R2 bundle"
            exit 1
          fi
          ( cd .cache/procurement && tar -cf - . | zstd -19 --long -T0 -o /tmp/procurement-cache.tar.zst -f )
          aws s3 cp /tmp/procurement-cache.tar.zst "s3://$R2_BUCKET/procurement-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded procurement cache to R2 ($n batches)"

      # ── 審議会（法務省・内閣府・国交省・厚労省、日次追跡） ───────

      - name: Fetch shingikai (moj, cao, mlit, mhlw)
        id: fetch_shingikai
        if: contains(env.DOMAINS, 'shingikai') || env.DOMAINS == ''
        continue-on-error: true
        run: |
          failed=0
          for ministry in moj cao mlit mhlw; do
            max_meetings=20
            # 国交省・厚労省は活動中委員会を横断するため、各委員会の最新だけを追う。
            # 既取得分はR2に残るので、新規開催と議事録の後日公開を日次で積み上げられる。
            if [ "$ministry" = "mlit" ] || [ "$ministry" = "mhlw" ]; then
              max_meetings=1
            fi
            ./target/release/lawpub shingikai-fetch \
              --ministry "$ministry" --cache .cache --provider "${LAWPUB_PROVIDER}" \
              --max-meetings "$max_meetings" || failed=1
          done
          ./target/release/lawpub shingikai-build-json \
            --cache .cache --public public
          exit "$failed"

      - name: Upload shingikai corpus to R2
        id: upload_shingikai
        if: (contains(env.DOMAINS, 'shingikai') || env.DOMAINS == '') && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          upload_bundle() {
            source="$1"
            object="$2"
            [ -d "$source" ] || { echo "::notice::no $source, skip $object"; return; }
            archive="/tmp/$object"
            ( cd "$source" && tar -cf - . | zstd -19 --long -T0 -o "$archive" -f )
            aws s3 cp "$archive" "s3://$R2_BUCKET/$object" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type 'application/zstd' \
              --cache-control 'public, max-age=300'
          }
          upload_bundle .cache/shingikai shingikai-cache.tar.zst
          upload_bundle .cache/shingikai-assets shingikai-assets.tar.zst
          upload_bundle .cache/shingikai-history shingikai-history.tar.zst

      # ── 予算（appId 設定後は日次更新） ───────────────────────────

      - name: Fetch budget (e-Stat)
        id: fetch_budget
        if: contains(env.DOMAINS, 'budget') && env.LAWPUB_ESTAT_APP_ID != ''
        continue-on-error: true
        run: |
          ./target/release/lawpub budget-fetch \
            --cache .cache --provider "${LAWPUB_PROVIDER}"
          ./target/release/lawpub budget-build-json \
            --cache .cache --public public

      - name: Upload budget cache to R2
        id: upload_budget
        if: contains(env.DOMAINS, 'budget') && env.LAWPUB_ESTAT_APP_ID != '' && env.R2_BUCKET != '' && env.R2_ENDPOINT != ''
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -d .cache/budget ] || { echo "::notice::no budget cache, skip R2 upload"; exit 0; }
          n=$(find .cache/budget -name '*.json' | wc -l | tr -d ' ')
          [ "${n:-0}" -gt 0 ] || { echo "::warning::budget cache is empty"; exit 1; }
          ( cd .cache/budget && tar -cf - . | zstd -19 --long -T0 -o /tmp/budget-cache.tar.zst -f )
          aws s3 cp /tmp/budget-cache.tar.zst "s3://$R2_BUCKET/budget-cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/zstd' \
            --cache-control 'public, max-age=300'
          echo "::notice::uploaded budget cache to R2 ($n datasets)"

      # ── キャッシュ保存 ────────────────────────────────────────────

      - name: Save corpus cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: corpus-cache-v1-${{ runner.os }}-${{ github.run_id }}

      # ── 実行記録 ──────────────────────────────────────────────────
      # このワークフローは Pages へ deploy しない。配信は法令ワークフロー
      # (update-law-data.yml) が R2 の各キャッシュ (proceedings-cache.tar.zst 等) を
      # 取り込んで laws と一緒に 1 つの public/ で行う。ここは fetch/build して
      # R2 にアップロードするまでが責務。データ源ごとの試行・成功時刻を記録する。
      - name: Commit state
        if: always()
        continue-on-error: true
        env:
          KOKKAI_OUTCOME: ${{ steps.fetch_kokkai.outcome }}
          KOKKAI_UPLOAD_OUTCOME: ${{ steps.upload_kokkai.outcome }}
          PUBCOMMENT_OUTCOME: ${{ steps.fetch_pubcomment.outcome }}
          PUBCOMMENT_UPLOAD_OUTCOME: ${{ steps.upload_pubcomment.outcome }}
          PROCUREMENT_OUTCOME: ${{ steps.fetch_procurement.outcome }}
          PROCUREMENT_UPLOAD_OUTCOME: ${{ steps.upload_procurement.outcome }}
          GIAN_OUTCOME: ${{ steps.fetch_gian.outcome }}
          GIAN_UPLOAD_OUTCOME: ${{ steps.upload_gian.outcome }}
          TSUTATSU_OUTCOME: ${{ steps.fetch_tsutatsu.outcome }}
          TSUTATSU_UPLOAD_OUTCOME: ${{ steps.upload_tsutatsu.outcome }}
          SHINGIKAI_OUTCOME: ${{ steps.fetch_shingikai.outcome }}
          SHINGIKAI_UPLOAD_OUTCOME: ${{ steps.upload_shingikai.outcome }}
          BUDGET_OUTCOME: ${{ steps.fetch_budget.outcome }}
          BUDGET_UPLOAD_OUTCOME: ${{ steps.upload_budget.outcome }}
          HANREI_OUTCOME: ${{ steps.fetch_hanrei.outcome }}
          HANREI_UPLOAD_OUTCOME: ${{ steps.upload_hanrei.outcome }}
          SHITSUMON_OUTCOME: ${{ steps.fetch_shitsumon.outcome }}
          SHITSUMON_UPLOAD_OUTCOME: ${{ steps.upload_shitsumon.outcome }}
          GUIDANCE_OUTCOME: ${{ steps.fetch_guidance.outcome }}
          GUIDANCE_UPLOAD_OUTCOME: ${{ steps.upload_guidance.outcome }}
          JLT_OUTCOME: ${{ steps.fetch_jlt.outcome }}
          JLT_UPLOAD_OUTCOME: ${{ steps.upload_jlt.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p state
          state_file=state/corpus_latest.json
          if ! jq -e '.version == 2 and (.corpora | type == "object")' "$state_file" >/dev/null 2>&1; then
            echo '{"version":2,"corpora":{}}' > "$state_file"
          fi
          update_domain() {
            key="$1"
            selector="$2"
            fetch_outcome="$3"
            upload_outcome="$4"
            case ",${DOMAINS}," in
              *",${selector},"*) ;;
              *) return 0 ;;
            esac
            # durable R2 保存まで成功して初めて collection success とする。
            # 未選択・前提step失敗による skipped は「試行」として記録しない。
            if [ "$fetch_outcome" = "failure" ] || [ "$upload_outcome" = "failure" ]; then
              outcome=failure
            elif [ "$fetch_outcome" = "success" ] && [ "$upload_outcome" = "success" ]; then
              outcome=success
            else
              return 0
            fi
            tmp=$(mktemp)
            jq --arg key "$key" --arg ts "$ts" --arg outcome "$outcome" '
              .corpora[$key] = ((.corpora[$key] // {}) + {
                last_attempt_at: $ts,
                status: $outcome
              })
              | if $outcome == "success"
                then .corpora[$key].last_success_at = $ts
                else .
                end
            ' "$state_file" > "$tmp"
            mv "$tmp" "$state_file"
          }
          update_domain proceedings kokkai "$KOKKAI_OUTCOME" "$KOKKAI_UPLOAD_OUTCOME"
          update_domain pubcomment pubcomment "$PUBCOMMENT_OUTCOME" "$PUBCOMMENT_UPLOAD_OUTCOME"
          update_domain procurement procurement "$PROCUREMENT_OUTCOME" "$PROCUREMENT_UPLOAD_OUTCOME"
          update_domain gian gian "$GIAN_OUTCOME" "$GIAN_UPLOAD_OUTCOME"
          update_domain tsutatsu tsutatsu "$TSUTATSU_OUTCOME" "$TSUTATSU_UPLOAD_OUTCOME"
          update_domain shingikai shingikai "$SHINGIKAI_OUTCOME" "$SHINGIKAI_UPLOAD_OUTCOME"
          update_domain budget budget "$BUDGET_OUTCOME" "$BUDGET_UPLOAD_OUTCOME"
          update_domain hanrei hanrei "$HANREI_OUTCOME" "$HANREI_UPLOAD_OUTCOME"
          update_domain shitsumon shitsumon "$SHITSUMON_OUTCOME" "$SHITSUMON_UPLOAD_OUTCOME"
          update_domain guidance guidance "$GUIDANCE_OUTCOME" "$GUIDANCE_UPLOAD_OUTCOME"
          update_domain jlt jlt "$JLT_OUTCOME" "$JLT_UPLOAD_OUTCOME"
          tmp=$(mktemp)
          jq --arg ts "$ts" --arg domains "$DOMAINS" '
            .version = 2 | .updated_at = $ts | .last_run_domains = $domains
          ' "$state_file" > "$tmp"
          mv "$tmp" "$state_file"
          git add state/corpus_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(corpus): refresh corpus data ($ts)"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || true
          done
