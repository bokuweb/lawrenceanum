name: e2e-kanpo-playground

on:
  pull_request:
    paths:
      - "figma/**"
      - "crates/kanpo-*/**"
      - "Cargo.lock"
      - ".github/workflows/e2e-kanpo-playground.yml"
  push:
    branches: [main]
    paths:
      - "figma/**"
      - "crates/kanpo-*/**"
      - "Cargo.lock"
      - ".github/workflows/e2e-kanpo-playground.yml"
  workflow_dispatch:

jobs:
  kanpo-playground:
    # Playwright 1.59 cannot install browser dependencies on ubuntu 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: figma
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: figma/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test pinned browser source checkout
        run: node --test scripts/build-ndlocr-wasm.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Restore JADE Core preview
        id: jade
        uses: actions/cache/restore@v4
        with:
          path: figma/src/wasm/jade-core
          key: jade-core-wasm-v1-${{ hashFiles('figma/scripts/build-jade-core.sh') }}
      - name: Build JADE Core preview
        if: steps.jade.outputs.cache-hit != 'true'
        run: pnpm build:jade
      - name: Cache built JADE Core preview
        if: steps.jade.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: figma/src/wasm/jade-core
          key: ${{ steps.jade.outputs.cache-primary-key }}
      - run: pnpm exec playwright test --config playwright.kanpo.config.ts
        env:
          JADE_CORE_PREBUILT: "1"
      - name: Build browser OCR and fetch verified models
        run: pnpm build:ocr
        env:
          NDLOCR_FETCH_MODELS: "1"
      - run: pnpm build
      - run: pnpm test:kanpo-docx-ocr
