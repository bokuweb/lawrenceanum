[package]
name = "kanpo-docx-wasm"
description = "kanpo-docx の WASM ラッパー（ブラウザで官報の PDF を DOCX にする）"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
js-sys = "0.3"
kanpo-docx = { path = "../kanpo-docx", default-features = false }
serde_json.workspace = true
wasm-bindgen = "0.2"
